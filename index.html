/* ===== nfa-pro-core.js ===== */
/* ============================================================

  function sess() {
    try { return JSON.parse(localStorage.getItem("nfa_auth") || "null"); } catch (e) { return null; }

  P.sess = sess;

  P.ME = function () {
    try { if (typeof me !== "undefined" && me && me.id) return me; } catch (e) {}

  P.role = function () { var m = P.ME() || {}; return String(m.role || ""); };

    window.addEventListener("hashchange", GUARD.hashLock);
    if (!document.getElementById("npWarn")) {
      var w = P.el("div", "npro np-warn");
      w.id = "npWarn";
      document.body.appendChild(w);
      GUARD.warnEl = w;
    }
  }
  function guardOff() {
    if (!GUARD.on) return;
    GUARD.on = false;
    window.removeEventListener("beforeunload", GUARD.beforeUnload);
    window.removeEventListener("hashchange", GUARD.hashLock);
  }
  S.toast = function (m) { P.toast(m); };

  /* ---------- زر الطوارئ ---------- */
  function emgOn(number) {
    var a = document.getElementById("npEmg");
    if (!a) {
      a = P.el("a", "npro np-emg", "📞 اتصال طوارئ");
      a.id = "npEmg";
      document.body.appendChild(a);
    }
    a.href = "tel:" + (number || "");
    a.classList.add("show");
    a.onclick = function () {
      /* يخرج للتطبيق الأب/المتصفح ثم يعود، والقفل يبقى فعّالًا */
      P.emit("player:emergency", { number: number });
      setTimeout(function () { document.documentElement.classList.add("nfa-returning"); }, 800);
    };
  }
  function emgOff() {
    var a = document.getElementById("npEmg");
    if (a) a.classList.remove("show");
  }

  /* ---------- العلامة المائية المتحركة ---------- */
  function wm(vw, text) {
    var d = P.el("div", "np-wm", P.esc(text));
    vw.appendChild(d);
    var iv = setInterval(function () {
      if (!document.body.contains(d)) { clearInterval(iv); return; }
      var x = Math.random() * 70, y = Math.random() * 80;
      d.style.insetInlineStart = x + "%";
      d.style.top = y + "%";
    }, 7000);
    return function () { clearInterval(iv); d.remove(); };
  }

  /* ---------- بناء المشغّل ---------- */
  S.open = function (opt) {
    if (cur && cur.el) cur.el.remove();
    var lesson = opt.lesson || {}, course = opt.course || {};
    var cfg = S.cfgOf(lesson, course);
    if (opt.mode) cfg.mode = opt.mode;

    var el = P.el("div", "npro");
    el.id = "nproPlayer";
    el.innerHTML =
      '<div class="np-top"><button class="npro-x" id="npX">✕</button><b>' + P.esc(lesson.title || "الدرس") + "</b>" +
      '<span class="npro-chip" id="npMode" style="background:#1f2937;color:#fff;border-color:#374151"></span></div>' +
      '<div class="np-vw" id="npVw"><video id="npV" playsinline preload="metadata"></video>' +
      '<div class="np-lock"><div><div style="font-size:42px">🔒</div><b style="display:block;margin:10px 0;font-size:17px">النظام الإجباري مفعّل</b>' +
      '<div class="npro-mut" style="color:#c7cbd6">لا يمكن مغادرة الدرس أو تقديم الفيديو قبل إكماله بالكامل.<br>في حال وجود حالة طوارئ استخدم زر الاتصال.</div></div></div></div>' +
      '<div class="np-meta" id="npMeta"></div>' +
      '<div class="np-bar">' +
      '<button id="npBack">⏪ 10ث</button><button id="npFwd">10ث ⏩</button>' +
      '<select id="npSpeed"><option>0.75</option><option>1</option><option>1.25</option><option>1.5</option><option>2</option></select>' +
      '<select id="npQ"><option value="auto">الجودة: تلقائي</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option></select>' +
      '<button id="npMirror">🪞 قلب</button>' +
      '<button id="npDone">✓ إكمال الدرس</button>' +
      "</div>";
    document.body.appendChild(el);

    var v = el.querySelector("#npV"), meta = el.querySelector("#npMeta"),
      lock = el.querySelector(".np-lock"), modeChip = el.querySelector("#npMode");
    modeChip.textContent = cfg.mode === "forced" ? "🔒 إجباري" : "▶ عادي";

    /* حالة الجلسة */
    cur = {
      el: el, v: v, cfg: cfg, lessonId: opt.lessonId || lesson.id, courseId: opt.courseId || course.id,
      en: opt.en || null, completed: false, segs: [], watched: 0, pauses: 0,
      pos: 0, dur: 0, lastSave: 0, dirty: false, alive: true
    };
    var prev = opt.progress || {};
    cur.segs = Array.isArray(prev.segments) ? prev.segments.map(function (x) { return [+x[0], +x[1]]; }) : [];
    cur.watched = +prev.watched_sec || 0;

    var unm = null;

    S.resolve(opt.url || lesson.video_url, opt.path || lesson.video_path).then(function (src) {
      if (!src) { P.toast("لا يوجد ملف فيديو لهذا الدرس"); return; }
      v.src = src;
      v.playbackRate = cfg.speed;
      el.querySelector("#npSpeed").value = String(cfg.speed);

      if (cfg.mode === "forced") {
        el.classList.add("locked");
        guardOn();
        function unlock() {
          el.classList.remove("locked");
          guardOff();
          emgOff();
        }
        cur.unlock = unlock;
        /* منع التقديم */
        v.addEventListener("seeking", function () {
          if (cur.completed) return;
          var maxAllowed = cur.maxSeen || 0;
          if (v.currentTime > maxAllowed + 2.5) {
            v.currentTime = maxAllowed;
            P.toast("⛔ التقديم مقفل في النظام الإجباري");
          }
        });
        /* التبويب في الخلفية = إيقاف */
        document.addEventListener("visibilitychange", function () {
          if (!cur || !document.body.contains(el)) return;
          if (document.hidden && !v.paused) {
            v.pause();
            if (GUARD.warnEl) {
              GUARD.warnEl.style.display = "block";
              GUARD.warnEl.textContent = "⚠️ تم إيقاف الفيديو: لا تترك التطبيق أثناء النظام الإجباري.";
              setTimeout(function () { GUARD.warnEl.style.display = "none"; }, 4500);
            }
          }
        });
        window.addEventListener("blur", function () { if (cur && !v.paused) v.pause(); });
      }

      /* العلامة المائية */
      if (cfg.watermark) {
        var m = P.ME() || {};
        unm = wm(el.querySelector("#npVw"), "NFA · " + (m.name || "") + " · " + (m.phone || ""));
      }

      /* الجودة: نُطبّق أفضل نسخة عبر تعديل src عند التوفّر */
      el.querySelector("#npQ").onchange = function (e) {
        var q = e.target.value;
        if (q === "auto") return;
        P.toast("تم طلب جودة " + q + "p — تُطبّق تلقائيًا عند توفر نسخ متعددة");
        saveCfg({ quality: q });
      };
      el.querySelector("#npQ").value = cfg.quality || "auto";

      /* الحماية من التحميل */
      if (!cfg.download) {
        el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        v.setAttribute("controlsList", "nodownload noplaybackrate noremoteplayback");
        v.disablePictureInPicture = true;
      }
      v.addEventListener("dragstart", function (e) { e.preventDefault(); });

      v.addEventListener("loadedmetadata", function () {
        cur.dur = v.duration || 0;
        if (cfg.resume && !prev.completed && +prev.position_sec > 5 && +prev.position_sec < cur.dur - 8) {
          v.currentTime = Math.max(0, +prev.position_sec - 3);
        }
        cur.maxSeen = v.currentTime || 0;
        paint();
      });

      var lastT = 0;
      v.addEventListener("timeupdate", function () {
        var t = v.currentTime, d = t - lastT;
        if (!v.paused && d > 0 && d < 2) {
          cur.watched += d;
          addSeg(lastT, t);
        }
        lastT = t; cur.pos = t; cur.dur = v.duration || cur.dur;
        if (t > (cur.maxSeen || 0)) cur.maxSeen = t;
        cur.dirty = true;
        if (!cur.completed && cover() >= cur.dur - 2 && cur.dur > 0) finish();
        if (Date.now() - cur.lastSave > 10000) { cur.lastSave = Date.now(); save(); }
        paint();
      });

      v.addEventListener("pause", function () {
        if (!cur || cur.completed) return;
        cur.pauses++;
        save();
        P.emit("player:pause", { at: v.currentTime, pauses: cur.pauses });
      });

      el.querySelector("#npBack").onclick = function () {
        if (cfg.mode === "forced" && !cur.completed) return P.toast("⛔ الرجوع مقفل");
        v.currentTime = Math.max(0, v.currentTime - 10);
      };
      el.querySelector("#npFwd").onclick = function () {
        if (cfg.mode === "forced" && !cur.completed) return P.toast("⛔ التقديم مقفل");
        v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 10);
      };
      el.querySelector("#npSpeed").onchange = function (e) { v.playbackRate = +e.target.value; saveCfg({ speed: +e.target.value }); };
      el.querySelector("#npMirror").onclick = function () {
        v.classList.toggle("mirror");
        this.classList.toggle("on");
      };
      el.querySelector("#npDone").onclick = function () {
        if (cover() >= cur.dur - 2 || cur.completed) finish();
        else P.toast("شاهد الدرس كاملًا أولًا (" + Math.round(cover() / (cur.dur || 1) * 100) + "%)");
      };
      el.querySelector("#npX").onclick = function () {
        if (cfg.mode === "forced" && !cur.completed) return P.toast("🔒 أكمل الدرس أو استخدم زر الطوارئ للخروج");
        close();
      };

      v.addEventListener("ended", function () {
        if (cover() >= cur.dur - 2) finish();
        else P.toast("لم تكتمل المشاهدة: لا تتخطَّ أجزاءً من الفيديو");
        save();
      });

      if (cfg.mode === "forced" && cfg.emergency) emgOn(cfg.emergency);
      else if (cfg.mode === "forced") emgOn("");
      v.play().catch(function () {});
    });

    function addSeg(a, b) {
      if (b <= a) return;
      cur.segs.push([a, b]);
      cur.segs.sort(function (x, y) { return x[0] - y[0]; });
      var out = [];
      cur.segs.forEach(function (q) {
        var l = out[out.length - 1];
        if (l && q[0] <= l[1] + 0.6) l[1] = Math.max(l[1], q[1]);
        else out.push([q[0], q[1]]);
      });
      cur.segs = out;
    }
    function cover() {
      return cur.segs.reduce(function (t, q) { return t + (q[1] - q[0]); }, 0);
    }
    S.cover = function () { return cur ? cover() : 0; };

    function paint() {
      if (!cur) return;
      var pct = Math.min(100, Math.round(cover() / (cur.dur || 1) * 100));
      meta.innerHTML =
        '<span>' + (cur.completed ? "✅ مكتمل" : "⏳ " + pct + "%") + "</span>" +
        "<span>الموضع: " + fmt(cur.pos) + " / " + fmt(cur.dur) + "</span>" +
        "<span>مشاهدة فعلية: " + fmt(cur.watched) + "</span>" +
        "<span>مرات التوقف: " + cur.pauses + "</span>" +
        (cur.cfg.mode === "forced" ? "<span>🔒 إجباري</span>" : "");
    }
    function fmt(t) {
      t = Math.max(0, Math.round(t || 0));
      var m = Math.floor(t / 60), s = t % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function save() {
      if (!cur || !cur.dirty) return;
      cur.dirty = false;
      var m = P.ME() || {};
      if (!m.id) return;
      P.api("POST", "lesson_progress?on_conflict=user_id,lesson_id", {
        user_id: m.id, course_id: cur.courseId, lesson_id: cur.lessonId,
        position_sec: Math.round(cur.pos), duration_sec: Math.round(cur.dur),
        watched_sec: Math.round(cur.watched), completed: !!cur.completed,
        segments: cur.segs.map(function (q) { return [Math.round(q[0] * 10) / 10, Math.round(q[1] * 10) / 10]; }),
        speed: cur.v.playbackRate, updated_at: Date.now()
      }, "resolution=merge-duplicates,return=minimal").catch(function () { cur.dirty = true; });
    }

    function finish() {
      if (!cur || cur.completed) return;
      cur.completed = true;
      cur.dirty = true;
      save();
      if (cur.unlock) cur.unlock();
      emgOff();
      P.toast("أحسنت! أكملت الدرس 🎉");
      if (cur.en && cur.en.id) {
        var done = Array.isArray(cur.en.done) ? cur.en.done.slice() : [];
        if (done.indexOf(cur.lessonId) < 0) {
          done.push(cur.lessonId);
          P.api("PATCH", "enrollments?id=eq." + encodeURIComponent(cur.en.id), { done: done }, "return=minimal").catch(function () {});
        }
      }
      if (typeof window.NFA_quiz === "function") {
        setTimeout(function () { try { window.NFA_quiz(cur.lessonId, cur.courseId); } catch (e) {} }, 700);
      }
      P.emit("lesson:done", { lessonId: cur.lessonId, courseId: cur.courseId });
    }
    S.finish = finish;

    function close() {
      if (!cur) return;
      cur.alive = false;
      save();
      try { v.pause(); } catch (e) {}
      if (unm) unm();
      guardOff();
      emgOff();
      el.remove();
      cur = null;
      if (opt.onClose) opt.onClose();
    }
    S.close = close;
  };

  /* استبدال المشغّل القديم: playLesson تُعاد تعريفها لتستدعي Pro
     مع الإبقاء على التوقيع نفسه (url, lid, cid, en, pg, done) */
  window.addEventListener("load", function () {
    setTimeout(function () {
      var legacy = window.playLesson;
      if (typeof legacy === "function") P.legacyPlayLesson = legacy;
      window.playLesson = function (url, lid, cid, en, pg, done) {
        var lesson = {}, course = {};
        try {
          var C = (window.NFA_COURSES || []).filter(function (c) { return c.id === cid; })[0];
          if (C) course = C;
          if (window.NFA_DB) { /* يُملأ غير متزامن أدناه */ }
        } catch (e) {}
        S.open({
          url: url, lessonId: lid, courseId: cid, en: en, progress: pg,
          lesson: lesson, course: course, onClose: done
        });
        /* إثراء العناوين من البيانات المتاحة */
        try {
          var cr = (window.NFA_COURSES || []).filter(function (c) { return c.id === cid; })[0];
          if (cr) {
            var el = document.getElementById("nproPlayer");
            var b = el && el.querySelector(".np-top b");
            if (b && !b.textContent) b.textContent = cr.title || "الدرس";
          }
        } catch (e) {}
      };
    }, 1200);
  });
})();

/* ===== nfa-pro-quiz.js ===== */
/* ============================================================
   NFA PRO · QUIZ ENGINE v2.0.0
   نظام اختبارات كامل: MCQ + مقالي + درجة نجاح + حلول وشرح فوري
   يُستدعى تلقائيًا بعد إكمال الدرس (NFA_quiz) ويُخزَّن في quiz_results
   ============================================================ */
(function () {
  "use strict";
  var P = window.NFA_PRO;
  if (!P) return;
  var Q = (P.quiz = {});

  Q.parse = function (lesson) {
    if (!lesson) return [];
    var raw = lesson.quiz || (lesson.extra && lesson.extra.quiz) || [];
    if (typeof raw === "string") { try { raw = JSON.parse(raw); } catch (e) { raw = []; } }
    if (!Array.isArray(raw)) return [];
    return raw.map(function (q, i) {
      return {
        i: i,
        type: q.type || (q.options && q.options.length ? "mcq" : "essay"),
        text: q.text || q.q || "سؤال " + (i + 1),
        options: q.options || [],
        answer: (q.answer === 0 || q.answer) ? q.answer : (q.a !== undefined ? q.a : null),
        solution: q.solution || q.explain || "",
        points: +q.points || 1
      };
    });
  };

  Q.open = function (lesson, courseId, onDone) {
    var qs = Q.parse(lesson);
    if (!qs.length) { if (onDone) onDone(null); return; }
    var pass = +(lesson.quizPass || (lesson.extra && lesson.extra.quizPass) || 60);
    var picked = {};
    var html = '<div class="npro-hd"><b>🧪 اختبار: ' + P.esc(lesson.title || "الدرس") + "</b>" +
      '<button class="npro-x" id="qzX">✕</button></div>' +
      '<div class="npro-mut" style="margin-bottom:12px">' + qs.length + " سؤال · درجة النجاح " + pass + "%</div>" +
      '<div id="qzBody"></div>' +
      '<div class="npro-row" style="margin-top:12px"><button class="npro-btn" id="qzGo">تسليم الاختبار</button>' +
      '<span class="npro-mut" id="qzSt"></span></div>';
    var ov = P.overlay(html, false);
    var body = ov.querySelector("#qzBody");

    function paint() {
      body.innerHTML = qs.map(function (q) {
        var opts = q.options.map(function (o, k) {
          return '<div class="nq-o' + (picked[q.i] === k ? " sel" : "") + '" data-q="' + q.i + '" data-k="' + k + '">' +
            '<b style="width:22px">' + String.fromCharCode(65 + k) + "</b><span>" + P.esc(o) + "</span></div>";
        }).join("");
        return '<div class="nq-q"><b>' + (q.i + 1) + ". " + P.esc(q.text) + "</b>" +
          (q.type === "essay"
            ? '<textarea class="npro-ta" rows="3" data-e="' + q.i + '" placeholder="اكتب إجابتك…"></textarea>'
            : opts) + "</div>";
      }).join("");
      body.querySelectorAll("[data-k]").forEach(function (d) {
        d.onclick = function () {
          picked[+d.dataset.q] = +d.dataset.k;
          paint();
        };
      });
    }
    paint();

    ov.querySelector("#qzX").onclick = function () { ov.remove(); };
    ov.querySelector("#qzGo").onclick = function () {
      var score = 0, total = 0;
      qs.forEach(function (q) {
        total += q.points;
        if (q.type !== "essay" && picked[q.i] === q.answer) score += q.points;
      });
      var pct = total ? Math.round(score / total * 100) : 0;
      var ok = pct >= pass;
      var m = P.ME() || {};
      if (m.id) {
        P.api("POST", "quiz_results", {
          user_id: m.id, course_id: courseId, lesson_id: lesson.id,
          score: score, total: total, passed: ok, at: Date.now()
        }, "return=minimal").catch(function () {});
      }
      /* شاشة الحلول */
      ov.querySelector(".npro-sheet").innerHTML =
        '<div class="npro-hd"><b>' + (ok ? "✅ نجحت" : "❌ لم تنجح") + "</b><button class=\"npro-x\" id=\"qzX2\">✕</button></div>" +
        '<div class="npro-card" style="text-align:center;margin-bottom:12px"><div style="font-size:34px;font-weight:800">' + pct + "%</div>" +
        '<div class="npro-mut">' + score + " من " + total + " · درجة النجاح " + pass + "%</div></div>" +
        qs.map(function (q) {
          var mine = picked[q.i], right = q.answer;
          var cls = q.type === "essay" ? "" : (mine === right ? "ok" : "no");
          return '<div class="nq-q"><b>' + (q.i + 1) + ". " + P.esc(q.text) + "</b>" +
            (q.type === "essay"
              ? '<div class="npro-mut">إجابة مقالية — تُصحَّح من المعلم.</div>'
              : '<div class="nq-o ' + cls + '">إجابتك: ' + P.esc(q.options[mine] !== undefined ? q.options[mine] : "—") + "</div>" +
                '<div class="nq-o ok">الصحيح: ' + P.esc(q.options[right] !== undefined ? q.options[right] : "—") + "</div>") +
            (q.solution ? '<div class="npro-mut" style="margin-top:8px">💡 ' + P.esc(q.solution) + "</div>" : "") +
            "</div>";
        }).join("");
      ov.querySelector("#qzX2").onclick = function () { ov.remove(); if (onDone) onDone({ pct: pct, ok: ok }); };
    };
  };

  /* نقطة الاستدعاء القديمة: نفس الاسم حتى لا ينكسر أي استدعاء سابق */
  window.NFA_quiz = function (lid, cid) {
    var l = (window.NFA_QZ || {})[lid];
    if (!l || !Q.parse(l).length) return;
    Q.open(l, cid, null);
  };
})();

/* ===== nfa-pro-msgr.js ===== */
/* ============================================================
   NFA PRO · MESSENGER v2.0.0
   مسنجر بثلاثة ألواح (قائمة المشتركين · المحادثة · بطاقة الطالب)
   - يعتمد نفس جدول messages ونفس نمط القنوات dm_<adminId>_<userId>
   - يعرض نوع الطالب وحالته وملفّه الشخصي داخل المحادثة
   - إرسال نص/صورة/فيديو (روابط من chat-media) + قلب الفيديو المرسل
   - يفتح تلقائيًا عند تفعيل الاشتراك (P.emit('sub:activated'))
   ============================================================ */
(function () {
  "use strict";
  var P = window.NFA_PRO;
  if (!P) return;
  var M = (P.msgr = {});

  var st = { open: false, sel: null, people: [], msgs: [], rt: null, filter: "" };

  function adminId() {
    var a = window.NFA_ADMIN_ID || (window.NFA_PRO_CFG || {}).adminId;
    if (a) return String(a);
    var u = st.people.filter(function (p) { return /^(owner|admin)$/.test(p.role || ""); })[0];
    return u ? String(u.id) : "admin";
  }
  M.channelFor = function (uid) { return "dm_" + adminId() + "_" + uid; };

  /* ---------- تحميل المشتركين (طلاب + معلمون) ---------- */
  M.load = function () {
    return Promise.all([
      P.sel("users", "select=id,name,email,phone,role,active,level,year,stream,extra", []),
      P.sel("enrollments", "select=*", []),
      P.sel("courses", "select=id,title,category,instructor_id,extra", []),
      P.sel("user_privacy_settings", "select=*", []),
      P.sel("friendships", "select=*", [])
    ]).then(function (r) {
      var U = r[0] || [], E = r[1] || [], C = r[2] || [], PV = r[3] || [], FR = r[4] || [];
      var pv = {}; PV.forEach(function (x) { pv[x.user_id] = x; });
      var byC = {}; C.forEach(function (c) { byC[c.id] = c; });
      st.people = U.map(function (u) {
        var mine = E.filter(function (e) { return e.user_id === u.id || e.userId === u.id; });
        var meta = u.extra || {};
        return {
          id: String(u.id), name: u.name || "طالب", role: u.role || "student",
          phone: u.phone || "", email: u.email || "",
          type: meta.student_type || meta.type || (mine.length ? "مشترك" : "طالب"),
          level: u.level || "", year: u.year || "", stream: u.stream || "",
          notes: meta.admin_notes || "",
          courses: mine.map(function (e) {
            var c = byC[e.course_id] || {};
            return { id: e.course_id, title: c.title || "دورة", expires: e.expires_at || null, status: e.sub_status || "active" };
          }),
          privacy: pv[u.id] || { major_visibility: "private", bio_visibility: "private" },
          major: (pv[u.id] && pv[u.id].major_specialty) || meta.major || "",
          bio: (pv[u.id] && pv[u.id].bio) || meta.bio || "",
          friends: FR
        };
      });
      return st.people;
    });
  };

  /* ---------- شلّة الواجهة ---------- */
  function shell() {
    if (document.getElementById("nproMsgr")) return document.getElementById("nproMsgr");
    var el = P.el("div", "npro");
    el.id = "nproMsgr";
    el.innerHTML =
      '<div class="nm-side"><div class="nm-sc"><div class="npro-hd" style="margin-bottom:8px">' +
      '<b>المحادثات</b><button class="npro-x" id="nmClose">✕</button></div>' +
      '<input class="npro-inp" id="nmQ" placeholder="ابحث بالاسم أو الدورة…"></div>' +
      '<div class="nm-list" id="nmList"></div></div>' +
      '<div class="nm-main"><div id="nmChatW"></div></div>' +
      '<div class="nm-card" id="nmCard"></div>';
    document.body.appendChild(el);
    el.querySelector("#nmClose").onclick = function () { M.close(); };
    el.querySelector("#nmQ").oninput = function (e) { st.filter = e.target.value.trim(); paintList(); };
    return el;
  }

  function paintList() {
    var el = document.getElementById("nproMsgr");
    if (!el) return;
    var list = el.querySelector("#nmList");
    var q = st.filter;
    var rows = st.people.filter(function (p) {
      if (!q) return true;
      return (p.name + " " + p.courses.map(function (c) { return c.title; }).join(" ")).indexOf(q) >= 0;
    });
    rows.sort(function (a, b) { return (b.courses.length > 0) - (a.courses.length > 0); });
    if (!rows.length) { list.innerHTML = '<p class="npro-mut" style="padding:14px">لا نتائج</p>'; return; }
    list.innerHTML = rows.map(function (p) {
      return '<div class="nm-it' + (st.sel && st.sel.id === p.id ? " act" : "") + '" data-u="' + P.esc(p.id) + '">' +
        '<div class="nm-av">' + P.esc((p.name || "?").slice(0, 1)) + "</div>" +
        '<div style="min-width:0"><div style="font-weight:700;font-size:14px">' + P.esc(p.name) + "</div>" +
        '<div class="npro-mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
        P.esc(p.type || "طالب") + (p.courses.length ? " · " + P.esc(p.courses[0].title) : "") + "</div></div></div>";
    }).join("");
    list.querySelectorAll("[data-u]").forEach(function (d) {
      d.onclick = function () { M.select(d.dataset.u); };
    });
  }

  M.select = function (uid) {
    st.sel = st.people.filter(function (p) { return p.id === String(uid); })[0] || null;
    paintList();
    paintChat();
    paintCard();
  };

  function paintChat() {
    var el = document.getElementById("nproMsgr");
    var w = el.querySelector("#nmChatW");
    if (!st.sel) { w.innerHTML = '<div style="padding:40px;text-align:center" class="npro-mut">اختر محادثة للبدء</div>'; return; }
    var ch = M.channelFor(st.sel.id);
    w.innerHTML =
      '<div class="nm-sc" style="display:flex;gap:10px;align-items:center">' +
      '<button class="npro-x" id="nmBack" style="display:none">→</button>' +
      '<div class="nm-av">' + P.esc(st.sel.name.slice(0, 1)) + "</div>" +
      '<div style="flex:1"><b>' + P.esc(st.sel.name) + "</b>" +
      '<div class="npro-mut">' + P.esc(st.sel.type) + " · " + P.esc(st.sel.phone || st.sel.email || "") + "</div></div>" +
      '<button class="npro-btn g" id="nmInfo">ℹ️</button></div>' +
      '<div class="nm-chat" id="nmChat"></div>' +
      '<div class="nm-in"><button class="npro-x" id="nmAtt">＋</button>' +
      '<input class="npro-inp" id="nmIn" placeholder="اكتب رسالة…">' +
      '<button class="npro-btn" id="nmSend">إرسال</button></div>' +
      '<input type="file" id="nmFile" accept="image/*,video/*" style="display:none">';
    document.getElementById("nmBack").onclick = function () { M.close(); };
    document.getElementById("nmInfo").onclick = function () {
      var c = el.querySelector("#nmCard"); c.style.display = c.style.display === "block" ? "none" : "block";
    };
    var inp = document.getElementById("nmIn");
    inp.onkeydown = function (e) { if (e.key === "Enter") send(); };
    document.getElementById("nmSend").onclick = send;
    document.getElementById("nmAtt").onclick = function () { document.getElementById("nmFile").click(); };
    document.getElementById("nmFile").onchange = function () { upload(this.files[0]); this.value = ""; };

    loadMsgs(ch);

    function send() {
      var t = inp.value.trim();
      if (!t) return;
      inp.value = "";
      push({ kind: "text", text: t });
    }
    function upload(f) {
      if (!f) return;
      var isVid = /^video\//.test(f.type);
      if (f.size > 50 * 1024 * 1024) return P.toast("الحد 50 ميغابايت");
      P.toast("⏳ جارٍ الرفع…");
      var name = ch + "/" + Date.now() + "_" + f.name.replace(/[^\w.\-]/g, "_");
      var s = P.sess();
      fetch((window.NFA_PRO_CFG || {}).url + "/storage/v1/object/chat-media/" + encodeURIComponent(name), {
        method: "POST",
        headers: {
          apikey: (window.NFA_PRO_CFG || {}).key,
          Authorization: "Bearer " + ((s && s.access_token) || (window.NFA_PRO_CFG || {}).key),
          "Content-Type": f.type, "x-upsert": "true"
        },
        body: f
      }).then(function (r) {
        if (!r.ok) throw new Error("upload");
        return (window.NFA_PRO_CFG || {}).url + "/storage/v1/object/public/chat-media/" + encodeURIComponent(name);
      }).then(function (url) {
        push({ kind: isVid ? "video" : "image", text: url });
      }).catch(function () {
        /* بديل: رابط محلي للمعاينة حتى يُفعّل باكت التخزين */
        var fr = new FileReader();
        fr.onload = function () { push({ kind: isVid ? "video" : "image", text: fr.result }); P.toast("تم الإرسال محليًا — فعّل باكت chat-media للتخزين الدائم"); };
        fr.readAsDataURL(f);
      });
    }
    function push(m) {
      var me = P.ME() || {};
      var row = { channel: ch, from: me.id, kind: m.kind, text: m.text, at: Date.now() };
      P.api("POST", "messages", row, "return=minimal").then(function () {
        st.msgs.push(row);
        paintMsgs();
      }).catch(function () {
        st.msgs.push(row); paintMsgs(); P.toast("تعذّر الحفظ — تحقق من الاتصال");
      });
    }
  }

  function loadMsgs(ch) {
    P.api("GET", "messages?select=*&channel=eq." + encodeURIComponent(ch) + "&order=at.asc")
      .catch(function () { return []; })
      .then(function (rows) {
        st.msgs = (rows || []).map(function (r) {
          return { channel: r.channel, from: r.from, kind: r.kind, text: r.text, at: r.at, extra: r.extra };
        });
        paintMsgs();
      });
    /* بثّ لحظي بسيط: استعلام دوري خفيف */
    if (st.rt) clearInterval(st.rt);
    st.rt = setInterval(function () {
      if (!st.open) return;
      P.api("GET", "messages?select=*&channel=eq." + encodeURIComponent(ch) + "&order=at.asc")
        .then(function (rows) {
          if (!rows || rows.length === st.msgs.length) return;
          st.msgs = rows.map(function (r) { return { channel: r.channel, from: r.from, kind: r.kind, text: r.text, at: r.at }; });
          paintMsgs();
        }).catch(function () {});
    }, 9000);
  }

  function paintMsgs() {
    var box = document.getElementById("nmChat");
    if (!box) return;
    var me = P.ME() || {};
    box.innerHTML = st.msgs.map(function (m) {
      var mine = String(m.from) === String(me.id);
      var body;
      if (m.kind === "image") body = '<img src="' + P.esc(m.text) + '" loading="lazy" alt="">';
      else if (m.kind === "video") {
        body = '<video src="' + P.esc(m.text) + '" controls playsinline style="max-width:100%;border-radius:12px"></video>' +
          '<div class="npro-row" style="margin-top:6px"><button class="npro-x" data-mir="' + P.esc(m.text) + '" title="قلب الفيديو">🪞</button></div>';
      } else body = P.esc(m.text);
      return '<div class="nm-b' + (mine ? " me" : "") + '">' + body + "</div>";
    }).join("") || '<div class="npro-mut" style="text-align:center;padding:20px">لا رسائل بعد 👋</div>';
    box.querySelectorAll("[data-mir]").forEach(function (b) {
      b.onclick = function () {
        var v = b.parentElement.parentElement.querySelector("video");
        if (v) v.style.transform = v.style.transform === "scaleX(-1)" ? "" : "scaleX(-1)";
      };
    });
    box.scrollTop = box.scrollHeight;
  }

  function paintCard() {
    var c = document.getElementById("nmCard");
    if (!c || !st.sel) return;
    var p = st.sel;
    c.innerHTML = '<b style="display:block;margin-bottom:10px">بطاقة الطالب</b>' +
      kv("الاسم", p.name) + kv("نوع الطالب", p.type) + kv("الهاتف", p.phone) + kv("البريد", p.email) +
      kv("المستوى", p.level + " " + p.year + " " + p.stream) +
      kv("التخصص", p.major || "—") +
      kv("خصوصية التخصص", p.privacy.major_visibility === "public" ? "عام" : p.privacy.major_visibility === "friends" ? "الأصدقاء" : "خاص") +
      '<div style="margin:12px 0 6px"><b style="font-size:13px">الدورات</b></div>' +
      (p.courses.map(function (x) {
        return '<div class="nm-kv"><span>' + P.esc(x.title) + "</span><span>" +
          (x.expires ? new Date(+x.expires).toLocaleDateString("ar") : "—") + "</span></div>";
      }).join("") || '<div class="npro-mut">لا اشتراكات</div>') +
      '<div style="margin:12px 0 6px"><b style="font-size:13px">ملاحظات إدارية (سرية)</b></div>' +
      '<textarea class="npro-ta" id="nmNotes" rows="3" placeholder="لا تظهر للطالب…">' + P.esc(p.notes) + "</textarea>" +
      '<button class="npro-btn" id="nmSaveNotes" style="margin-top:8px">حفظ الملاحظات</button>';
    c.querySelector("#nmSaveNotes").onclick = function () {
      var v = c.querySelector("#nmNotes").value;
      P.api("PATCH", "users?id=eq." + encodeURIComponent(p.id), { extra: Object.assign({}, { admin_notes: v }) }, "return=minimal")
        .then(function () { p.notes = v; P.toast("تم حفظ الملاحظات"); })
        .catch(function () { P.toast("تعذّر الحفظ"); });
    };
    function kv(k, v) { return '<div class="nm-kv"><span>' + k + "</span><span>" + P.esc(v || "—") + "</span></div>"; }
  }

  M.open = function (uid) {
    var el = shell();
    el.classList.add("open");
    st.open = true;
    M.load().then(function () {
      paintList();
      if (uid) M.select(uid);
      else if (st.people.length) M.select(st.people[0].id);
      else paintChat();
    });
  };
  M.close = function () {
    var el = document.getElementById("nproMsgr");
    if (el) el.classList.remove("open");
    st.open = false;
    if (st.rt) clearInterval(st.rt);
  };

  P.on("open:msgr", function (d) { M.open(d && d.uid); });
  P.on("sub:activated", function (d) {
    if (!d || !d.userId) return;
    P.toast("✅ تم تفعيل الاشتراك — فُتحت محادثة خاصة مع الإدارة");
    M.open(d.userId);
  });
})();

/* ===== nfa-pro-people.js ===== */
/* ============================================================
   NFA PRO · PEOPLE v2.0.0
   الملف الشخصي + الخصوصية (عام / أصدقاء / خاص) + الصداقات
   + أساتذة الدورة مع إظهارهم أو إخفائهم + الأقسام
   ============================================================ */
(function () {
  "use strict";
  var P = window.NFA_PRO;
  if (!P) return;
  var PP = (P.people = {});

  var VIS = { public: "عام للجميع", friends: "الأصدقاء فقط", private: "خاص بي والإدارة" };

  PP.profile = function (uid) {
    return Promise.all([
      P.sel("users", "select=*&id=eq." + encodeURIComponent(uid), []),
      P.sel("user_privacy_settings", "select=*&user_id=eq." + encodeURIComponent(uid), []),
      P.sel("friendships", "select=*&or=(requester_id.eq." + encodeURIComponent(uid) + ",receiver_id.eq." + encodeURIComponent(uid) + ")", [])
    ]).then(function (r) {
      return { user: (r[0] || [])[0] || {}, privacy: (r[1] || [])[0] || {}, friends: r[2] || [] };
    });
  };

  PP.openSelf = function () {
    var m = P.ME();
    if (!m) return P.toast("سجّل الدخول أولًا");
    PP.profile(m.id).then(function (d) {
      var u = d.user || {}, pv = d.privacy || {};
      var html = '<div class="npro-hd"><b>👤 ملفي الشخصي</b><button class="npro-x" id="ppX">✕</button></div>' +

        '<div class="nm-av" style="width:56px;height:56px;font-size:20px">' + P.esc((u.name || "?").slice(0, 1)) + "</div>" +
        '<div><b>' + P.esc(u.name || "") + "</b><div class=\"npro-mut\">" + P.esc(u.email || "") + "</div></div></div>" +
        '<label class="npro-mut">التخصص</label><input class="npro-inp" id="ppMajor" value="' + P.esc(pv.major_specialty || (u.extra && u.extra.major) || "") + '">' +
        '<label class="npro-mut">ظهور التخصص</label><select class="npro-sel" id="ppMajorVis">' + opts(pv.major_visibility) + "</select>" +
        '<label class="npro-mut">نبذة</label><textarea class="npro-ta" id="ppBio" rows="3">' + P.esc(pv.bio || "") + "</textarea>" +
        '<label class="npro-mut">ظهور النبذة</label><select class="npro-sel" id="ppBioVis">' + opts(pv.bio_visibility) + "</select>" +
        '<label class="npro-mut">ظهور بيانات الاتصال</label><select class="npro-sel" id="ppContact">' + opts(pv.contact_info_visibility) + "</select>" +
        '<button class="npro-btn" id="ppSave" style="margin-top:12px">حفظ الخصوصية</button>';
      var ov = P.overlay(html, true);
      ov.querySelector("#ppX").onclick = function () { ov.remove(); };
      ov.querySelector("#ppSave").onclick = function () {
        var row = {
          user_id: m.id,
          major_specialty: ov.querySelector("#ppMajor").value,
          major_visibility: ov.querySelector("#ppMajorVis").value,
          bio: ov.querySelector("#ppBio").value,
          bio_visibility: ov.querySelector("#ppBioVis").value,
          contact_info_visibility: ov.querySelector("#ppContact").value
        };
        P.api("POST", "user_privacy_settings?on_conflict=user_id", row, "resolution=merge-duplicates,return=minimal")
          .then(function () { P.toast("تم حفظ إعدادات الخصوصية"); ov.remove(); })
          .catch(function () { P.toast("تعذّر الحفظ — نفّذ سكربت SQL أولًا"); });
      };
    });
    function opts(cur) {
      return Object.keys(VIS).map(function (k) {
        return '<option value="' + k + '"' + (cur === k ? " selected" : "") + ">" + VIS[k] + "</option>";
      }).join("");
    }
  };

  /* ---------- دليل الطلاب والصداقات ---------- */
  PP.directory = function () {
    Promise.all([
      P.sel("users", "select=id,name,role,level,year,extra", []),
      P.sel("user_privacy_settings", "select=*", []),
      P.sel("friendships", "select=*", [])
    ]).then(function (r) {
      var me = P.ME() || {}, U = r[0] || [], PV = r[1] || [], FR = r[2] || [];
      var pv = {}; PV.forEach(function (x) { pv[x.user_id] = x; });
      var html = '<div class="npro-hd"><b>👥 دليل الطلاب</b><button class="npro-x" id="pdX">✕</button></div>' +
        U.filter(function (u) { return u.id !== me.id && u.role !== "owner" && u.role !== "admin"; }).map(function (u) {
          var p = pv[u.id] || {};
          var rel = FR.filter(function (f) {
            return (f.requester_id === me.id && f.receiver_id === u.id) || (f.receiver_id === me.id && f.requester_id === u.id);
          })[0];
          var major = p.major_visibility === "public" ? (p.major_specialty || "") : "🔒";
          return '<div class="npro-card" style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
            '<div class="nm-av">' + P.esc((u.name || "?").slice(0, 1)) + "</div>" +
            '<div style="flex:1"><b>' + P.esc(u.name) + "</b>" +
            '<div class="npro-mut">' + P.esc(major || "طالب") + " · " + P.esc((u.level || "") + " " + (u.year || "")) + "</div></div>" +
            (rel ? '<span class="npro-chip">' + (rel.status === "accepted" ? "✅ صديق" : rel.status === "pending" ? "⏳ معلّق" : rel.status) + "</span>"
              : (me.role === "owner" || me.role === "admin" ? "" : '<button class="npro-btn g" data-add="' + P.esc(u.id) + '">＋ صداقة</button>')) + "</div>";
        }).join("");
      var ov = P.overlay(html, false);
      ov.querySelector("#pdX").onclick = function () { ov.remove(); };
      ov.querySelectorAll("[data-add]").forEach(function (b) {
        b.onclick = function () {
          P.api("POST", "friendships", {
            requester_id: me.id, receiver_id: b.dataset.add, status: "pending", created_at: Date.now()
          }, "return=minimal").then(function () {
            b.outerHTML = '<span class="npro-chip">⏳ معلّق</span>';
            P.toast("أُرسل طلب الصداقة");
          }).catch(function () { P.toast("تعذّر الإرسال"); });
        };
      });
    });
  };

  /* ---------- أساتذة الدورة (مع إظهار/إخفاء) ---------- */
  PP.courseInstructors = function (courseId) {
    return Promise.all([
      P.sel("course_instructors", "select=*&course_id=eq." + encodeURIComponent(courseId), []),
      P.sel("users", "select=id,name,role,extra", [])
    ]).then(function (r) {
      var CI = r[0] || [], U = r[1] || [];
      var byId = {}; U.forEach(function (u) { byId[u.id] = u; });
      return CI.filter(function (x) { return x.visible !== false; }).map(function (x) {
        var u = byId[x.instructor_id] || {};
        return { id: x.instructor_id, name: u.name || x.name || "أستاذ", title: x.title || (u.extra && u.extra.title) || "أستاذ المادة" };
      });
    });
  };
  PP.renderInstructors = function (courseId) {

      if (!list.length) { box.innerHTML = ""; return; }

        list.map(function (t) {
          return '<span class="npro-chip">🎓 ' + P.esc(t.name) + " · " + P.esc(t.title) + "</span>";
        }).join("") + "</div></div>";
    });
  };

  /* ---------- بوابة: زر الملف الشخصي في القائمة الكبيرة ---------- */
  P.on("open:profile", function () {
    var m = P.ME() || {};

      '<div class="npro-card"><b>' + P.esc(m.name || "") + "</b><div class=\"npro-mut\">" + P.esc(m.role || "") + "</div></div>" +
      '<div class="npro-row" style="margin-top:12px">' +
      '<button class="npro-btn" id="acProf">تعديل ملفي والخصوصية</button>' +
      '<button class="npro-btn g" id="acDir">دليل الطلاب والصداقات</button>' +
      '<button class="npro-btn g" id="acMsgs">محادثاتي</button></div>';
    var ov = P.overlay(html, true);
    ov.querySelector("#acX").onclick = function () { ov.remove(); };
    ov.querySelector("#acProf").onclick = function () { ov.remove(); PP.openSelf(); };
    ov.querySelector("#acDir").onclick = function () { ov.remove(); PP.directory(); };
    ov.querySelector("#acMsgs").onclick = function () { ov.remove(); P.emit("open:msgr"); };
  });
  P.on("open:teacher", function () {
    var m = P.ME() || {};
    Promise.all([
      P.sel("courses", "select=id,title,instructor_id", []),
      P.sel("enrollments", "select=*", []),
      P.sel("users", "select=id,name,phone,extra", [])
    ]).then(function (r) {
      var C = (r[0] || []).filter(function (c) { return c.instructor_id === m.id; });
      var E = r[1] || [], U = r[2] || [];
      var ids = C.map(function (c) { return c.id; });
      var mine = E.filter(function (e) { return ids.indexOf(e.course_id) >= 0; });
      var byU = {}; U.forEach(function (u) { byU[u.id] = u; });
      var html = '<div class="npro-hd"><b>🎓 قسم المعلم</b><button class="npro-x" id="tcX">✕</button></div>' +
        '<div class="npro-mut" style="margin-bottom:10px">' + mine.length + " مشترك في " + C.length + " دورة</div>" +

/* ===== nfa-pro-hooks.js ===== */
/* ============================================================
   NFA PRO · HOOKS v2.0.0
   نقاط الربط الدقيقة مع الواجهة القديمة (بدون حذف أي شيء):
   1) حقن بطاقة «أساتذة الدورة» داخل صفحة الدورة
   2) اعتراض تفعيل الاشتراك => إنشاء المحادثة تلقائيًا
   3) إظهار الزر الكبير بدل مكدّس الأيقونات القديم
   ============================================================ */
(function () {
  "use strict";
  var P = window.NFA_PRO;
  if (!P) return;

  /* ---------- 1) أساتذة الدورة داخل صفحة الدورة ---------- */
  function injectInstructors() {
    if (!P.people) return;
    var h = location.hash || "";
    var m = h.match(/^#\/course\/([^\/?]+)/);
    if (!m) return;
    var cid = decodeURIComponent(m[1]);
    var host = document.querySelector(".npro-inst-host");
    if (host) { P.people.renderInstructors(cid); return; }
    /* نحقن حاوية بعد أول بطاقة داخل محتوى الشل */
    var main = document.querySelector("#app main") || document.querySelector("#app") || document.body;
    var card = main ? main.querySelector(".card") : null;
    if (!card) return;
    var box = document.createElement("div");
    box.className = "npro npro-inst-host";
    box.setAttribute("data-npro-inst", cid);
    card.parentNode.insertBefore(box, card.nextSibling);
    P.people.renderInstructors(cid);
  }

  var lastHash = "";
  setInterval(function () {
    if (location.hash === lastHash) return;
    lastHash = location.hash;
    setTimeout(injectInstructors, 900);
  }, 700);
  window.addEventListener("hashchange", function () { setTimeout(injectInstructors, 900); });

  /* ---------- 2) اعتراض تفعيل الاشتراك ---------- */
  /* عند أي كتابة ناجحة على enrollments بحالة active نفتح المحادثة */
  var raw = P.api;
  P.api = function (method, path, body, prefer) {
    var pr = raw.apply(P, arguments);
    try {
      if (method === "POST" && /^enrollments/.test(path) && body && (body.sub_status === "active" || body.user_id)) {
        pr.then(function () {
          if (P.admin && P.admin.ensureDirectChat) {
            P.admin.ensureDirectChat(P.ME() && P.ME().id);
          }
        }).catch(function () {});
      }
    } catch (e) {}
    return pr;
  };

  /* ---------- 3) إخفاء الأيقونات القديمة المكرّرة ---------- */
  function hideLegacy() {
    ["nbfab"].forEach(function (id) {
      var e = document.getElementById(id);
      if (e) {
        e.style.display = "none";
        e.setAttribute("data-npro-replaced", "1");
      }
    });
  }
  setInterval(hideLegacy, 1200);

  /* ---------- 4) إشعار عام بالجاهزية ---------- */
  setTimeout(function () { try { window.dispatchEvent(new Event("nfa:ready")); } catch (e) {} }, 1500);
})();

#nfa-np .ls{padding:10px 14px 18px!important;gap:8px!important}
#nfa-np .it{border-radius:16px!important;padding:12px 14px!important}
#v3Scrim{position:fixed;inset:0;background:rgba(8,8,14,.5);z-index:9985;opacity:0;pointer-events:none;transition:opacity .22s}
#v3Scrim.on{opacity:1;pointer-events:auto}

/* ---------- 2) هيكل التطبيق بعد تسجيل الدخول ---------- */
body.v3-app{background:var(--v3-bg)}
body.v3-app #app{background:var(--v3-bg);min-height:100vh}
body.v3-app :is(#app) .mn{background:transparent}
body.v3-app #app .tb{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + var(--v3-sat));min-height:64px;
  background:color-mix(in srgb,var(--v3-surface) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--v3-line);box-shadow:none;position:sticky;top:0;z-index:60}
body.v3-app #app .tb>b{flex:1;font-size:18px;font-weight:800;letter-spacing:0;max-width:none;color:var(--v3-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.v3-app #app .tb .u{display:none}
.v3-ib{width:44px;height:44px;flex:none;border-radius:14px;border:0;background:var(--v3-sunk);color:var(--v3-text);display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;padding:0;transition:transform .12s,background .15s}
.v3-ib:active{transform:scale(.94)}
.v3-ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.v3-dot{position:absolute;top:9px;inset-inline-end:9px;width:10px;height:10px;border-radius:50%;background:#ef4444;border:2px solid var(--v3-surface)}
.v3-avb{padding:0;overflow:hidden;border-radius:50%}
body.v3-app #app .nct{max-width:960px;margin:0 auto;padding:22px 16px 40px;display:block}
body.v3-app #app .nct>*+*{margin-top:18px}
body.v3-app :is(#app,.md) .card{background:var(--v3-surface);border:1px solid var(--v3-line);border-radius:var(--v3-r);box-shadow:var(--v3-sh);padding:20px}
body.v3-app :is(#app) .grid{gap:16px}
body.v3-app :is(#app) .nhero{border-radius:26px;padding:26px 24px;display:flex;gap:16px;align-items:center;line-height:1.7}
body.v3-app :is(#app) .muted{color:var(--v3-mut)}
body.v3-app :is(#app) .btn2{border-radius:14px;padding:11px 18px}
body.v3-app :is(#app) .inp{border-radius:14px;background:var(--v3-surface);border-color:var(--v3-line)}
body.v3-app :is(#app) h1,body.v3-app :is(#app) h2,body.v3-app :is(#app) h3{letter-spacing:0;line-height:1.4}

/* شريط التنقل السفلي (هاتف) */
@media(max-width:800px){
  body.v3-app :is(#app) .nsb{background:color-mix(in srgb,var(--v3-surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--v3-line);box-shadow:none;padding:8px 8px calc(8px + var(--v3-sab));gap:4px}
  body.v3-app :is(#app) .nsb #lo{display:none}
  body.v3-app :is(#app) .nsb a{border-radius:14px;padding:8px 2px 6px;font-size:11.5px;font-weight:600;color:var(--v3-mut);gap:3px}
  body.v3-app :is(#app) .nsb a.on{color:var(--v3-text);background:var(--v3-sunk)}
  body.v3-app :is(#app) .nsb a svg{width:22px;height:22px}
  body.v3-app :is(#app) .mn{padding-bottom:calc(84px + var(--v3-sab))}
  body.v3-app #app .nct{padding:18px 14px 28px}
  body.v3-app :is(#app,.md) .card{padding:18px}
}
@media(min-width:801px){
  body.v3-app #app{display:flex}
  body.v3-app :is(#app) .nsb{width:264px;padding:22px 14px;background:var(--v3-surface);border-inline-end:1px solid var(--v3-line);gap:6px}
  body.v3-app :is(#app) .nsb a{border-radius:14px;padding:12px 14px;font-weight:600;color:var(--v3-mut)}
  body.v3-app :is(#app) .nsb a.on{background:var(--v3-ink);color:var(--v3-onink)}
  body.v3-app #app .tb{padding-inline:24px}
}


/* ---------- 4) الصور الرمزية ---------- */
.v3-av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;
  font-weight:800;font-size:calc(var(--s)*.4);color:#fff;background:#52525b;user-select:none;position:relative}
.v3-av img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- 5) الملف الشخصي (على نمط فيسبوك) ---------- */
#v3P{position:fixed;inset:0;z-index:9800;background:var(--v3-bg);color:var(--v3-text);overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
html[data-theme=dark] #v3P{background:#050507}
#v3P.on{transform:none;visibility:visible}
#v3P .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + var(--v3-sat));pointer-events:none}
#v3P .bar .v3-ib{pointer-events:auto;background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(8px)}
#v3P .wrap{max-width:760px;margin:0 auto;padding-bottom:calc(40px + var(--v3-sab))}
#v3P .cover{height:210px;margin-top:calc(-64px - var(--v3-sat));background:linear-gradient(135deg,#27272a,#52525b);position:relative;overflow:hidden}
#v3P .cover::after{content:"";position:absolute;inset:0;background:radial-gradient(520px 220px at 85% 0,rgba(255,255,255,.22),transparent 70%)}
#v3P .head{padding:0 18px;margin-top:-54px;position:relative;z-index:2;display:flex;align-items:flex-end;gap:14px}
#v3P .head .v3-av{--s:112px;border:5px solid var(--v3-bg);box-shadow:0 6px 20px rgba(0,0,0,.18)}
html[data-theme=dark] #v3P .head .v3-av{border-color:#050507}
#v3P .nm{padding:12px 20px 0}
#v3P .nm h1{margin:0;font-size:25px;font-weight:800;line-height:1.35}
#v3P .nm .sub{color:var(--v3-mut);font-size:14.5px;margin-top:2px}
#v3P .bio{padding:10px 20px 0;line-height:1.8;font-size:15.5px;white-space:pre-wrap;word-break:break-word}
#v3P .acts{display:flex;gap:10px;padding:16px 18px 6px;flex-wrap:wrap}
.v3-btn{border:0;border-radius:14px;padding:12px 20px;font:700 15px inherit;font-family:inherit;background:var(--v3-ink);color:var(--v3-onink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.v3-btn.g{background:var(--v3-sunk);color:var(--v3-text)}
.v3-btn.d{background:#fee2e2;color:#991b1b}
.v3-btn.ok{background:#dcfce7;color:#166534}
.v3-btn:disabled{opacity:.5;cursor:default}
.v3-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#v3P .acts .v3-btn{flex:1;min-width:130px}
#v3P .stats{display:flex;gap:0;margin:14px 18px 0;background:var(--v3-surface);border:1px solid var(--v3-line);border-radius:18px;overflow:hidden}
#v3P .stats div{flex:1;text-align:center;padding:14px 6px}
#v3P .stats div+div{border-inline-start:1px solid var(--v3-line)}
#v3P .stats b{display:block;font-size:20px;font-weight:800}
#v3P .stats span{font-size:12.5px;color:var(--v3-mut)}
#v3P .tabs{display:flex;gap:6px;padding:16px 18px 0;overflow-x:auto;scrollbar-width:none}
#v3P .tabs::-webkit-scrollbar{display:none}
#v3P .tabs button{border:0;background:none;color:var(--v3-mut);font:700 15px inherit;font-family:inherit;padding:10px 16px;border-radius:99px;cursor:pointer;white-space:nowrap}
#v3P .tabs button.on{background:var(--v3-ink);color:var(--v3-onink)}
#v3P .pane{padding:14px 18px 0;display:grid;gap:12px}
.v3-card{background:var(--v3-surface);border:1px solid var(--v3-line);border-radius:18px;padding:16px 18px}
.v3-card h3{margin:0 0 10px;font-size:16px;font-weight:800}
.v3-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--v3-line)}
.v3-row:last-child{border-bottom:0}
.v3-row svg{width:20px;height:20px;stroke:var(--v3-mut);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.v3-row .k{color:var(--v3-mut);font-size:13px}
.v3-row .v{font-weight:600;font-size:15px;word-break:break-word}
.v3-row .t{flex:1;min-width:0}
.v3-pend{display:flex;gap:12px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:18px;padding:14px 16px;margin:14px 18px 0;font-size:14.5px;line-height:1.7}
html[data-theme=dark] .v3-pend{background:rgba(180,83,9,.16);border-color:rgba(251,191,36,.35);color:#fde68a}
.v3-pend svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;flex:none;margin-top:2px;stroke-linecap:round;stroke-linejoin:round}
.v3-pend button{border:0;background:none;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0;margin-inline-start:6px}
.v3-fr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--v3-line)}
.v3-fr:last-child{border-bottom:0}
.v3-fr .t{flex:1;min-width:0}
.v3-fr b{display:block;font-size:15px}
.v3-fr small{color:var(--v3-mut)}
.v3-fr .v3-btn{padding:8px 14px;min-height:38px;font-size:13.5px}
.v3-empty{text-align:center;color:var(--v3-mut);padding:26px 10px;font-size:14.5px}
.v3-cv{height:130px;border-radius:16px;margin-top:6px;position:relative}
.v3-sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.v3-sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.v3-sw button.on{border-color:var(--v3-text)}

/* نماذج / أوراق سفلية */
.v3-sheet{position:fixed;inset:0;z-index:9900;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,8,14,.55);animation:v3f .2s}
@keyframes v3f{from{opacity:0}to{opacity:1}}
.v3-sheet .in{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--v3-surface);color:var(--v3-text);border-radius:26px 26px 0 0;
  padding:8px 20px calc(22px + var(--v3-sab));animation:v3u .28s cubic-bezier(.2,.8,.2,1)}
html[data-theme=dark] .v3-sheet .in{background:#0e0e11}
@keyframes v3u{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.v3-sheet .gr{width:44px;height:5px;border-radius:9px;background:var(--v3-line);margin:6px auto 14px}
.v3-sheet h2{margin:0 0 4px;font-size:20px;font-weight:800}
.v3-sheet p.lead{margin:0 0 14px;color:var(--v3-mut);font-size:14px;line-height:1.7}
.v3-f{display:grid;gap:6px;margin-bottom:14px}
.v3-f label{font-size:13px;font-weight:700;color:var(--v3-mut)}
.v3-f input,.v3-f textarea,.v3-f select{width:100%;border:1.5px solid var(--v3-line);background:var(--v3-bg);color:var(--v3-text);border-radius:14px;padding:12px 14px;font:16px inherit;font-family:inherit;outline:none;min-height:48px}
html[data-theme=dark] .v3-f input,html[data-theme=dark] .v3-f textarea,html[data-theme=dark] .v3-f select{background:rgba(255,255,255,.06)}
.v3-f input:focus,.v3-f textarea:focus,.v3-f select:focus{border-color:var(--v3-ink)}
.v3-f textarea{min-height:92px;resize:vertical;line-height:1.7}
.v3-f .ch{border-color:#d97706!important}
.v3-ph{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.v3-ph .v3-av{--s:84px}
.v3-ph .t{flex:1}
.v3-ph small{color:var(--v3-mut);display:block;margin-top:4px;font-size:12.5px;line-height:1.6}
.v3-btns{display:flex;gap:10px;margin-top:6px}
.v3-btns .v3-btn{flex:1}

/* ---------- 6) المحادثات (مسنجر) ---------- */
#v3M{position:fixed;inset:0;z-index:9750;background:var(--v3-bg);color:var(--v3-text);display:none;overflow:hidden}
html[data-theme=dark] #v3M{background:#050507}
#v3M.on{display:flex}
#v3M .ls{width:100%;display:flex;flex-direction:column;min-width:0;background:var(--v3-surface)}
#v3M .ls .top{padding:calc(14px + var(--v3-sat)) 16px 8px;display:flex;align-items:center;gap:10px}
#v3M .ls .top h2{margin:0;flex:1;font-size:26px;font-weight:800}
#v3M .sch{margin:6px 16px 10px;display:flex;align-items:center;gap:10px;background:var(--v3-sunk);border-radius:99px;padding:0 16px;height:46px}
#v3M .sch svg{width:19px;height:19px;stroke:var(--v3-mut);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
#v3M .sch input{flex:1;border:0;background:none;outline:none;font:16px inherit;font-family:inherit;color:var(--v3-text);min-width:0;padding:0}
#v3M .rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 8px calc(16px + var(--v3-sab))}
#v3M .rw{display:flex;align-items:center;gap:13px;padding:10px 10px;border-radius:16px;cursor:pointer;border:0;background:none;width:100%;color:inherit;font:inherit;text-align:start}
#v3M .rw:active,#v3M .rw.on{background:var(--v3-sunk)}
#v3M .rw .v3-av{--s:56px}
#v3M .rw .t{flex:1;min-width:0}
#v3M .rw .n{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v3M .rw .p{color:var(--v3-mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#v3M .rw.un .n,#v3M .rw.un .p{font-weight:800;color:var(--v3-text)}
#v3M .rw .m{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;min-width:44px}
#v3M .rw .m time{font-size:12px;color:var(--v3-mut)}
#v3M .rw .m .bg{min-width:22px;height:22px;border-radius:99px;background:var(--v3-ink);color:var(--v3-onink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
#v3M .gl{margin:12px 12px 4px;font-size:12.5px;font-weight:700;color:var(--v3-mut)}
#v3M .ch{display:none;flex-direction:column;flex:1;min-width:0;background:var(--v3-bg);position:relative}
html[data-theme=dark] #v3M .ch{background:transparent}
#v3M.chat .ls{display:none}
#v3M.chat .ch{display:flex}
#v3M .ch .hd{display:flex;align-items:center;gap:12px;padding:10px 12px;padding-top:calc(10px + var(--v3-sat));background:var(--v3-surface);border-bottom:1px solid var(--v3-line)}
#v3M .ch .hd .v3-av{--s:44px}
#v3M .ch .hd .t{flex:1;min-width:0}
#v3M .ch .hd b{display:block;font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v3M .ch .hd small{color:var(--v3-mut);font-size:12.5px}
#v3M .ch .hd .v3-ib{background:none}
#v3M .msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 8px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
#v3M .day{align-self:center;margin:12px 0 8px;font-size:12px;font-weight:700;color:var(--v3-mut);background:var(--v3-sunk);padding:4px 12px;border-radius:99px}
#v3M .sy{align-self:center;font-size:12.5px;color:var(--v3-mut);padding:6px 12px;text-align:center}
#v3M .bw{display:flex;align-items:flex-end;gap:8px;max-width:84%}
#v3M .bw.me{align-self:flex-end;flex-direction:row-reverse}
#v3M .bw.th{align-self:flex-start}
#v3M .bw .v3-av{--s:30px;margin-bottom:2px}
#v3M .bw .sp{width:30px;flex:none}
#v3M .bb{padding:10px 14px;border-radius:20px;font-size:15.5px;line-height:1.65;word-break:break-word;white-space:pre-wrap;position:relative;min-width:0}
#v3M .th .bb{background:var(--v3-surface);color:var(--v3-text);border:1px solid var(--v3-line)}
#v3M .me .bb{background:var(--v3-ink);color:var(--v3-onink)}
#v3M .th.f .bb{border-end-start-radius:6px}
#v3M .me.f .bb{border-end-end-radius:6px}
#v3M .th.mid .bb{border-start-start-radius:6px;border-end-start-radius:6px}
#v3M .me.mid .bb{border-start-end-radius:6px;border-end-end-radius:6px}
#v3M .th.l .bb{border-start-start-radius:6px}
#v3M .me.l .bb{border-start-end-radius:6px}
#v3M .bb .who{display:block;font-size:12.5px;font-weight:800;margin-bottom:2px;opacity:.75}
#v3M .bb time{display:block;font-size:11px;opacity:.6;margin-top:3px;text-align:end;white-space:nowrap}
#v3M .bb.md{padding:4px;background:transparent!important;border:0!important}
#v3M .bb.md img,#v3M .bb.md video{display:block;max-width:100%;max-height:340px;border-radius:18px}
#v3M .bb.fail::after{content:"لم تُرسل — اضغط لإعادة المحاولة";display:block;font-size:11.5px;color:#fecaca;margin-top:4px}
#v3M .cmp{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + var(--v3-sab));background:var(--v3-surface);border-top:1px solid var(--v3-line)}
#v3M .cmp textarea{flex:1;border:0;outline:none;background:var(--v3-sunk);color:var(--v3-text);border-radius:22px;padding:12px 16px;font:16px/1.5 inherit;font-family:inherit;resize:none;max-height:130px;min-height:46px}
#v3M .cmp .v3-ib{background:none}
#v3M .cmp .snd{background:var(--v3-ink);color:var(--v3-onink);border-radius:50%}
#v3M .cmp .snd:disabled{opacity:.35}
#v3M .cmp .snd svg{transform:scaleX(-1)}
#v3M .empty{margin:auto;text-align:center;color:var(--v3-mut);padding:30px;line-height:1.9}
#v3M .empty .v3-av{--s:84px;margin-bottom:10px}
#v3M .nochat{display:none}
@media(min-width:900px){
  #v3M .ls{width:380px;flex:none;border-inline-end:1px solid var(--v3-line)}
  #v3M .ch{display:flex}
  #v3M.chat .ls{display:flex}
  #v3M .ch .back{display:none}
  #v3M .nochat{display:flex;margin:auto;flex-direction:column;align-items:center;gap:8px;color:var(--v3-mut)}
  #v3M .ch.none>:not(.nochat){display:none}
  #v3M .bw{max-width:68%}
}
#v3M .info{padding:6px 2px}

/* ---------- 7) طلبات تعديل الملفات (لوحة الإدارة) ---------- */
.v3-rq{background:var(--v3-surface,#fff);border:1px solid var(--v3-line,#e5e5e5);border-radius:18px;padding:16px;margin-bottom:12px;color:var(--v3-text,inherit)}
.v3-rq .h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.v3-rq .h .t{flex:1;min-width:0}
.v3-rq .h b{display:block}
.v3-rq .h small{color:var(--v3-mut,#737373)}
.v3-df{display:grid;gap:8px;margin:8px 0 12px}
.v3-df .r{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start;font-size:14px}
.v3-df .r>span{color:var(--v3-mut,#737373);font-size:13px;padding-top:2px}
.v3-df .o{text-decoration:line-through;opacity:.55;display:block;word-break:break-word}
.v3-df .n{font-weight:700;display:block;word-break:break-word}
.v3-df img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.v3-rq .note{width:100%;border:1.5px solid var(--v3-line,#e5e5e5);border-radius:12px;padding:10px 12px;font:inherit;margin-bottom:10px;background:transparent;color:inherit}
.v3-rq .bt{display:flex;gap:8px}
.v3-rq .bt button{flex:1;border:0;border-radius:12px;padding:12px;font:700 14.5px inherit;font-family:inherit;cursor:pointer}
.v3-rq .bt .y{background:#16a34a;color:#fff}

        var usable = C.filter(function (c) { return co[String(c.id)] && Object.keys(co[String(c.id)]).length; });
        if (!usable.length) return none();
        var sel = {}, cur = String(usable[0].id);
        o.querySelector(".nfa-in").innerHTML = '<div class="nfa-gr"></div><h2>مجموعة جديدة</h2><p class="nfa-hint">يمكن إنشاء المجموعة فقط مع من يشاركك دورة واحدة على الأقل.</p><div class="v3-f"><input id="gT" placeholder="اسم المجموعة" maxlength="60"></div><div class="v3-f"><select id="gC">' +
          usable.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc((c.icon || "📘") + " " + c.title) + "</option>"; }).join("") + '</select></div><div class="v3-f"><input id="gQ" placeholder="ابحث بالاسم أو الـ ID"></div><div id="gL" class="nfa-gl"></div><button class="v3-btn" id="gGo" style="width:100%;margin-top:10px">إنشاء المجموعة</button>';
        function paint() {
          var q = o.querySelector("#gQ").value.trim().toLowerCase(), ids = Object.keys(co[cur] || {});
          o.querySelector("#gL").innerHTML = ids.map(function (i) { return V().people[i]; }).filter(function (p) { return p && (!q || String(p.name || "").toLowerCase().indexOf(q) >= 0 || String(pid(p.id)).indexOf(q) >= 0); }).map(function (p) {
            return '<label class="v3-fr">' + avatar(p, 38) + '<div class="t"><b>' + esc(p.name) + "</b><small>ID: " + esc(pid(p.id)) + '</small></div><input type="checkbox" data-u="' + esc(p.id) + '"' + (sel[p.id] ? " checked" : "") + "></label>";
          }).join("") || '<div class="v3-empty">لا نتائج</div>';
        }
        paint();
        o.querySelector("#gC").onchange = function () { cur = this.value; sel = {}; paint(); };
        o.querySelector("#gQ").oninput = paint;
        o.querySelector("#gL").onchange = function (e) { var u = e.target.dataset.u; if (u) { if (e.target.checked) sel[u] = 1; else delete sel[u]; } };
        o.querySelector("#gGo").onclick = function () {
          var title = o.querySelector("#gT").value.trim(), ids = Object.keys(sel);
          if (title.length < 2) return toast("اكتب اسم المجموعة");
          if (!ids.length) return toast("اختر عضوًا واحدًا على الأقل");
          if (ids.some(function (i) { return !co[cur][i]; })) return toast("يمكن إضافة أعضاء الدورة المشتركة فقط");
          this.disabled = true; var btn = this;
          api("POST", "rpc/nfa_create_group", { p_title: title, p_course: cur, p_members: ids }).then(function (gid) {
            gid = Array.isArray(gid) ? gid[0] : gid;
            return api("POST", "messages", { channel: "grp:" + gid, from: m.id, kind: "system", text: (m.name || "مستخدم") + " أنشأ المجموعة", at: Date.now(), extra: {} }, "return=minimal").catch(noop);
          }).then(function () { o.close(); toast("تم إنشاء المجموعة"); return S.load(true); }).then(function () { if (V().msgr) V().msgr.open(); })
            .catch(function (er) { btn.disabled = false; toast(/no_shared_course/.test(errText(er)) ? "لا توجد دورة مشتركة بينكم" : /member_unavailable/.test(errText(er)) ? "أحد الأعضاء غير متاح" : /banned/.test(errText(er)) ? "حسابك محظور من المراسلة" : "تعذّر إنشاء المجموعة"); });
        };
      });
    });
    function none() { o.querySelector(".nfa-in").innerHTML = '<div class="nfa-gr"></div><h2>مجموعة جديدة</h2><div class="v3-empty">🚫 لا توجد دورة مشتركة بينك وبين أي مستخدم، لذلك لا يمكن إنشاء مجموعة.</div>'; }
  };

  /* ---------------- لوحة الأدمن: حظر المراسلة + البلاغات ---------------- */
  S.mountAdmin = function (box) {
    if (!box) return;
    box.innerHTML = '<div class="nfa-adm"><p class="nfa-hint">الحظر هنا يمنع المستخدم من إرسال الرسائل وطلبات الصداقة. من يراسله يرى أنه محظور، وفي البحث يظهر «محظور في الوقت الحالي» دون أي تفاصيل. مراسلة الإدارة تبقى متاحة له.</p><div class="v3-f"><input id="aQ" placeholder="ابحث عن مستخدم بالاسم أو بالـ ID"></div><div id="aRes"></div><h3>⛔ المحظورون حاليًا</h3><div id="aBans">…</div><h3>🚩 البلاغات</h3><div id="aRep">…</div></div>';
    var q = box.querySelector("#aQ");
    function nm(i) { return esc(ppl(i).name) + " <small>(ID " + esc(pid(i) || "—") + ")</small>"; }
    function load() {
      Promise.all([V().loadPeople(), loadPids(), get("messaging_bans?select=*&order=at.desc", []), get("user_reports?select=*&status=eq.open&order=at.desc&limit=60", [])]).then(function (r) {
        S.st.bans = r[2];
        var act = r[2].filter(function (b) { return b.permanent || (+b.until_at || 0) > Date.now(); });
        box.querySelector("#aBans").innerHTML = act.map(function (b) {
          return '<div class="nfa-row"><div>' + nm(b.user_id) + "<br><small>" + (b.permanent ? "دائم" : "حتى " + esc(new Date(+b.until_at).toLocaleString("ar")) + " · متبقٍ " + esc(dur(+b.until_at - Date.now()))) + '</small></div><button class="v3-btn g" data-lift="' + esc(b.user_id) + '">فك الحظر</button></div>';
        }).join("") || '<div class="v3-empty">لا أحد محظور</div>';
        box.querySelector("#aRep").innerHTML = r[3].map(function (x) {
          return '<div class="nfa-row"><div><b>' + nm(x.target_id) + "</b><br><small>بلاغ من " + nm(x.reporter_id) + " · " + esc(new Date(+x.at).toLocaleString("ar")) + "</small><br>" + esc(x.reason || "") + '</div><div class="nfa-bt"><button class="v3-btn" data-ban="' + esc(x.target_id) + '">حظر</button><button class="v3-btn g" data-close="' + esc(x.id) + '">تجاهل</button></div></div>';
        }).join("") || '<div class="v3-empty">لا بلاغات</div>';
        search();
      });
    }
    function search() {
      var t = q.value.trim(), tl = t.toLowerCase(); var res = box.querySelector("#aRes");
      if (!t) { res.innerHTML = ""; return; }
      res.innerHTML = Object.keys(V().people).map(function (k) { return V().people[k]; }).filter(function (p) {
        return !/^(owner|admin)$/.test(p.role || "") && (String(p.name || "").toLowerCase().indexOf(tl) >= 0 || String(pid(p.id)).indexOf(t) >= 0);
      }).slice(0, 15).map(function (p) {
        var b = S.banInfo(p.id);
        return '<div class="nfa-row">' + avatar(p, 38) + "<div>" + nm(p.id) + (b ? "<br><small>⛔ " + (b.permanent ? "محظور دائمًا" : "محظور مؤقتًا") + "</small>" : "") + '</div><button class="v3-btn' + (b ? " g" : "") + '" data-ban="' + esc(p.id) + '">' + (b ? "تعديل" : "حظر") + "</button></div>";
      }).join("") || '<div class="v3-empty">لا نتائج</div>';
    }
    q.oninput = search;
    function banDlg(uid) {
      var o = modal("<h2>حظر المراسلة: " + esc(ppl(uid).name) + '</h2><div class="nfa-seg"><button class="on" data-m="perm">حظر دائم</button><button data-m="time">حظر مدة معينة</button></div><div id="bT" hidden class="nfa-two"><input id="bN" type="number" min="1" value="1"><select id="bU"><option value="36e5">ساعة</option><option value="864e5" selected>يوم</option><option value="6048e5">أسبوع</option></select></div><div class="v3-f" style="margin-top:10px"><input id="bR" placeholder="السبب (يُسجَّل للإدارة فقط)"></div><button class="v3-btn" id="bGo" style="width:100%">تطبيق الحظر</button><button class="v3-btn g" id="bLift" style="width:100%;margin-top:8px">فك الحظر</button>'), mode = "perm";
      o.querySelector(".nfa-seg").onclick = function (e) { var b = e.target.closest("[data-m]"); if (!b) return; mode = b.dataset.m; o.querySelectorAll(".nfa-seg button").forEach(function (x) { x.classList.toggle("on", x === b); }); o.querySelector("#bT").hidden = mode !== "time"; };
      o.querySelector("#bGo").onclick = function () {
        var adm = me().id, now = Date.now(), until = null;
        if (mode === "time") { var n = +o.querySelector("#bN").value, un = +o.querySelector("#bU").value; if (!(n > 0)) return toast("أدخل مدة صحيحة"); until = now + n * un; }
        api("POST", "messaging_bans?on_conflict=user_id", { user_id: uid, permanent: mode === "perm", until_at: until, by: adm, at: now }, "resolution=merge-duplicates,return=minimal").then(function () {
          api("POST", "messaging_ban_log", { user_id: uid, action: mode === "perm" ? "ban_permanent" : "ban_timed", until_at: until, reason: o.querySelector("#bR").value.trim(), by: adm, at: now }, "return=minimal").catch(noop);
          api("POST", "notifications", { user_id: uid, text: "⛔ تم تقييد المراسلة وإرسال طلبات الصداقة على حسابك" + (until ? " مؤقتًا" : "") + ". يمكنك التواصل مع الإدارة.", at: now }, "return=minimal").catch(noop);
          o.close(); toast("تم الحظر"); load();
        }).catch(function () { toast("تعذّر الحظر — تأكد من تشغيل ملف SQL"); });
      };
      o.querySelector("#bLift").onclick = function () { lift(uid, function () { o.close(); }); };
    }
    function lift(uid, done) {
      api("DELETE", "messaging_bans?user_id=eq." + enc(uid), undefined, "return=minimal").then(function () {
        api("POST", "messaging_ban_log", { user_id: uid, action: "lift", by: me().id, at: Date.now() }, "return=minimal").catch(noop);
        toast("تم فك الحظر"); if (done) done(); load();
      }).catch(function () { toast("تعذّر فك الحظر"); });
    }
    box.onclick = function (e) {
      var b = e.target.closest("[data-ban]"), l = e.target.closest("[data-lift]"), c = e.target.closest("[data-close]");
      if (b) banDlg(b.dataset.ban);
      else if (l) lift(l.dataset.lift);
      else if (c) api("PATCH", "user_reports?id=eq." + enc(c.dataset.close), { status: "closed" }, "return=minimal").then(load).catch(noop);
    };
    load();
  };

  /* ---------------- منع تكرار الأسماء ---------------- */
  var NAME_MSG = "هذا الاسم مستخدم بالفعل. أضف نقطة أو فاصلة أو أي رمز لاسمك ليتميّز عن غيره.";
  function nameTaken(name, uid) {
    var sb = window.SB, body = { p_name: name, p_exclude: uid || null }, p;
    try { p = sb && sb.call ? sb.call("POST", "rpc/nfa_name_taken", body) : api("POST", "rpc/nfa_name_taken", body); } catch (e) { return Promise.resolve(false); }
    return Promise.resolve(p).then(function (t) { return t === true || (Array.isArray(t) && t[0] === true); }).catch(function () { return false; });
  }
  S.checkName = function (name, ok, say) { nameTaken(name).then(function (t) { if (t) (say || toast)(NAME_MSG); else ok(); }); };
  S.nameOk = function (name, uid) {
    return nameTaken(name, uid).then(function (t) { if (t) { toast(NAME_MSG); var e = new Error("NAME_TAKEN"); e.nameTaken = true; throw e; } });
  };

  /* ---------------- ربط لوحة الأدمن + تفعيل البحث الجديد + حماية طلبات الصداقة ---------------- */
  function hookAll() {
    var v = V(), p = P();
    if (v && v.directory !== S.directory) { v.directory = S.directory; }
    if (p && p.people && p.people.directory !== S.directory) p.people.directory = S.directory;
    if (p && p.api && !p.api._nfs) {
      var o = p.api, w = function (m, path, b) {
        try {
          if (m === "POST" && /^friendships(\?|$)/.test(path) && b) {
            var u = me();
            if (u && (b.receiver_id === u.id || (b.requester_id && b.requester_id === b.receiver_id))) { toast("لا يمكنك إرسال طلب صداقة لنفسك"); return new Promise(function () {}); }
            if (u && !meStaff()) {
              var bad = S.blockedBetween(u.id, b.receiver_id) ? "لا يمكن إرسال طلب صداقة لهذا المستخدم" : S.banInfo(u.id) ? "⛔ حسابك محظور حاليًا — لا يمكنك إرسال طلبات صداقة" : S.banInfo(b.receiver_id) ? "🚫 هذا المستخدم محظور في الوقت الحالي" : "";
              if (bad) { toast(bad); return new Promise(function () {}); }
            }
          }
        } catch (e) {}
        return o.apply(this, arguments);
      };
      w._nfs = 1; try { p.api = w; } catch (e) {}
    }
    try {
      if (window.TABS && window.V && typeof window.V === "object" && !window.TABS.some(function (t) { return t[0] === "sfty"; })) {
        window.TABS.push(["sfty", "🚫 المراسلة والبلاغات"]);
        window.V.sfty = function () { return '<h2>حظر المراسلة والبلاغات</h2><div id="nfaSfty"></div>'; };
        window.AFTER = window.AFTER || {}; window.AFTER.sfty = function () { S.mountAdmin(document.getElementById("nfaSfty")); };
        if (window.GROUPS) window.GROUPS.forEach(function (g) { if (g[1].indexOf("users") > -1 && g[1].indexOf("sfty") < 0) g[1].push("sfty"); });
      }
    } catch (e) {}
    try {
      var A = p && p.admin;
      if (A && !A._sfty) {
        A._sfty = 1; var oo = A.open;
        A.open = function () {
          oo.apply(A, arguments);
          var bar = document.querySelector("#nproAdm .na-tabs"); if (!bar || bar.querySelector("[data-sfty]")) return;
          var b = document.createElement("button"); b.textContent = "🚫 المراسلة والبلاغات"; b.setAttribute("data-sfty", "1");
          bar.insertBefore(b, bar.querySelector("#naClose"));
          bar.addEventListener("click", function (e) { if (e.target.closest("[data-t]")) b.classList.remove("on"); });
          b.onclick = function () { bar.querySelectorAll("[data-t]").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); S.mountAdmin(document.getElementById("naBody")); };
        };
      }
    } catch (e) {}
  }
  var n = 0, iv = setInterval(function () { hookAll(); if (++n > 240) clearInterval(iv); }, 1000);
  hookAll();
})();

</script></body></html>
